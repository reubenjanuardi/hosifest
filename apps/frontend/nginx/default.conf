# nginx config for the HOSIFEST frontend container.
#
# Serves the Next.js standalone output that runs on 127.0.0.1:3000 in the same
# container, and reverse-proxies /api to the backend on the private internal
# Docker network. The backend is never published directly.
#
# ${BACKEND_UPSTREAM} is substituted by envsubst at container start (see the
# Dockerfile and NGINX_ENVSUBST_FILTER). Use ${...} so envsubst matches it;
# nginx runtime variables ($host, $uri, ...) must NOT use that form.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Static assets copied out of the standalone build.
    root /srv;
    index index.html;

    # Container-local liveness endpoint. Answers without touching the backend
    # or the Next.js server, so a dependency restart cannot cascade here.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Payment-proof uploads are capped here as a backstop; the application
    # enforces the authoritative MIME/size rules.
    client_max_body_size 10m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Immutable Next.js build assets.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /public/ {
        try_files $uri =404;
    }

    # Reverse proxy to the backend API. The backend serves the API under
    # /api/v1 and exposes /health and /ready unprefixed, so those become
    # /api/health and /api/ready from the outside.
    location /api {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Do not fail startup if the backend is still restarting: resolve the
        # name lazily per request instead of at config load time.
        resolver 127.0.0.11 valid=10s ipv6=off;
    }

    # Everything else goes to the Next.js standalone server.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
